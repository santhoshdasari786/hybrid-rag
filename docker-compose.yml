# Full local stack: API + Qdrant (vectors) + PostgreSQL/pgvector (registry, optional vectors).
#   docker compose up --build
#   open http://localhost:8080/docs
# Switch to pgvector for vectors:  RAG_PROFILE=config/profiles/pgvector.yaml docker compose up

name: advanced-rag

services:
  api:
    build:
      context: .
      args:
        EXTRAS: qdrant,fastembed,pgvector,anthropic,openai,pdf,migrations
    image: advanced-rag-service:local
    ports: ["8080:8080"]
    environment:
      RAG_CONFIG_FILE: config/rag.yaml,${RAG_PROFILE:-config/profiles/qdrant-hybrid.yaml}
      RAG_ENVIRONMENT: dev
      LOG_FORMAT: json
      QDRANT_URL: http://qdrant:6333
      PG_DSN: postgresql://rag:rag@postgres:5432/rag
      REGISTRY_URL: postgresql+psycopg://rag:rag@postgres:5432/rag
      RAG__REGISTRY__URL: postgresql+psycopg://rag:rag@postgres:5432/rag
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - models:/app/data/models          # FastEmbed model cache survives rebuilds
    depends_on:
      qdrant: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  models:
  qdrant:
  postgres:
