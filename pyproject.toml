[project]
name = "advanced-rag-service"
version = "1.0.0"
description = "Configurable, enterprise-grade Advanced RAG micro-service (chunking, embedding, indexing, hybrid retrieval, re-ranking, chat)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "RAG Platform Team" }]
keywords = ["rag", "retrieval", "hybrid-search", "fastapi", "qdrant", "pgvector", "splade"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "anyio>=4.4",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.12"]
fastembed = ["fastembed>=0.5"]
pgvector = ["psycopg[binary,pool]>=3.2", "pgvector>=0.3"]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=2.0"]
# Subscription-backed Claude via the Claude Code CLI (personal / development use; see doc/adr/0006).
claude-lite = ["claude-lite-llm>=0.2,<0.3"]
pdf = ["pypdf>=4.0"]
tokenizers = ["tiktoken>=0.7"]
migrations = ["alembic>=1.13"]
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]
all = [
    "advanced-rag-service[qdrant,fastembed,pgvector,anthropic,openai,gemini,claude-lite,pdf,tokenizers,migrations]",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]

[project.scripts]
rag-service = "rag_service.__main__:main"

[project.entry-points."rag_service.plugins"]
# Third-party packages can register components here, e.g.
# my_plugin = "my_package.rag_plugin:register"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_service"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF", "ASYNC", "S", "PT", "RET", "PL", "TID",
]
ignore = [
    "PLR0913",  # many args is fine for DI constructors
    "PLR2004",  # magic values in tests / thresholds
    "PLR0912",  # branches
    "PLR0915",  # statements
    "PLR0911",  # returns
    "S101",     # asserts are used for invariants
    "RUF012",   # mutable class vars in pydantic models are fine
    "B008",     # FastAPI Depends() in defaults
    "PLR0917",  # keyword-only is enforced where it matters; positional DI args are fine
    "RUF001", "RUF002", "RUF003",  # typographic characters (–, ×, σ) in docs are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802", "ARG", "PT018", "PLC0415", "TID251"]
"scripts/**" = ["T201", "S", "PLC0415"]
# The cookbook runner composes the app in process, like the tests do.
"cookbook/**" = ["T201", "S", "PLC0415", "TID251"]
# The API layer may import itself; everything else (domain, application, adapters, core) may not.
"src/rag_service/api/**" = ["TID251"]
# SQL is composed from internal constants and psycopg placeholders only; values are always bound.
"src/rag_service/adapters/vectorstores/pgvector.py" = ["S608"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"rag_service.api".msg = "Domain/application layers must not import the API layer."

[tool.ruff.lint.isort]
known-first-party = ["rag_service"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["rag_service"]

[[tool.mypy.overrides]]
module = [
    "fastembed.*", "qdrant_client.*", "pgvector.*", "pypdf.*", "tiktoken.*",
    "opentelemetry.*", "psycopg.*", "psycopg_pool.*", "anthropic.*", "openai.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires external services (Qdrant / Postgres). Enable with RAG_IT=1.",
    "models: downloads ML models (fastembed). Enable with RAG_MODELS=1.",
]
filterwarnings = ["ignore::DeprecationWarning:fastembed.*"]

[tool.coverage.run]
source = ["src/rag_service"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
