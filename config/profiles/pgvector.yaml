# PostgreSQL for everything: pgvector for vectors (dense HNSW + sparsevec) and the registry.
# RAG_CONFIG_FILE=config/rag.yaml,config/profiles/pgvector.yaml   (extras: pgvector, fastembed)
# pgvector cannot apply IDF, so pair it with a learned sparse model (SPLADE), not raw BM25 weights.

vector_store:
  provider: pgvector
  pgvector:
    dsn: ${PG_DSN:-postgresql://rag:rag@localhost:5432/rag}
    db_schema: rag
    hnsw_m: 16
    hnsw_ef_construction: 64
    ef_search: 60

registry:
  url: ${REGISTRY_URL:-postgresql+psycopg://rag:rag@localhost:5432/rag}
  pool_size: 10

defaults:
  embedding:
    dense:
      provider: fastembed
      model: BAAI/bge-small-en-v1.5
      query_prefix: "Represent this sentence for searching relevant passages: "
      options: {cache_dir: "${FASTEMBED_CACHE:-./data/models}"}
    sparse:
      provider: fastembed
      model: prithivida/Splade_PP_en_v1
      options: {cache_dir: "${FASTEMBED_CACHE:-./data/models}"}
